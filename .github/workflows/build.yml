name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out sources
        uses: actions/checkout@v5

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install freestanding x86 build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-multilib nasm grub-pc-bin grub-common xorriso mtools python3 qemu-system-x86

      - name: Run fixture-independent tests
        run: make test

      - name: Build kernel and bootable disk images
        run: make all TARGET=qemu VIDEO=vga

      - name: Run Ring-3 guest smoke test
        run: make test-smoke TARGET=qemu VIDEO=vga

      - name: Run Ring-3 guest smoke test with PIT scheduling
        run: make test-smoke-pit TARGET=qemu VIDEO=vga

      - name: Run Ring-3 guest memory matrix (32/64/256/1024 MiB)
        run: make test-smoke-memory TARGET=qemu VIDEO=vga

      - name: Run graphical desktop framebuffer smoke test
        run: make test-smoke-desktop TARGET=qemu

      - name: Upload guest smoke log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guest-smoke-log
          path: |
            build/guest-smoke.log
            build/guest-smoke-pit.log
            build/guest-smoke-memory-32m.log
            build/guest-smoke-memory-64m.log
            build/guest-smoke-memory-256m.log
            build/guest-smoke-memory-1024m.log
            build/guest-smoke-desktop.log
            build/guest-smoke-desktop.ppm
          if-no-files-found: ignore
