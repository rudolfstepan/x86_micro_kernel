schema_version = 1
baseline_id = "REIST-research"
status = "complete"
intended_purpose = "Research operating-system baseline for bounded isolation, recoverability and fault-injection experiments on the documented i386 reference configurations."
system_boundary = "The BIOS-loaded REIST kernel, mediated devices, packaged Ring-3 services, shell and graphical workspace; host hypervisors, external power, operators and unselected product profiles are outside the trusted system boundary."
operating_environment = "QEMU and VMware i386 reference machines plus explicitly identified experimental x86 target hardware in a laboratory environment."
selected_profiles = ["generic-research"]
excluded_profiles = ["medical-reference", "spacecraft-reference", "industrial-control-reference", "experimental-fpga-reference"]
foreseeable_misuse = [
  "Treating a passing research build as a certified or production safety system.",
  "Enabling an unqualified device, DMA path, filesystem or target machine.",
  "Using a reference profile as a release claim without a concrete product hazard analysis.",
  "Interrupting power or removing media during mutation and assuming an unverified successful commit.",
  "Bypassing capabilities, maintenance leases, fencing or the supervisor lifecycle through rescue or debug paths."
]
unsupported_claims = [
  "Certification or regulatory approval.",
  "Fail-operational behavior without electrically independent target channels.",
  "DMA isolation for unmediated devices on systems without a qualified IOMMU.",
  "Integrity of foreign or unmarked writable filesystems after power loss.",
  "Coverage of medical, spacecraft, industrial-control or FPGA product hazards."
]

[[essential_function]]
id = "EF-ISOLATION-001"
title = "Preserve protection and authority boundaries"
description = "Reject stale, malformed or unauthorized memory, IPC, capability and device operations before externally visible side effects."
degraded_state = "Reject optional work and preserve supervisor/restart reserves."
safe_state = "Fence registered outputs and stop the affected channel when kernel integrity is uncertain."
ftti_ms = 250
components = ["CMP-KERNEL", "CMP-MEMORY", "CMP-IPC", "CMP-DEVICE-DOMAIN"]

[[essential_function]]
id = "EF-RECOVERY-001"
title = "Bound failure containment and recovery"
description = "Detect a failed component generation, fence and revoke it, recover within fixed budgets and publish only a self-tested replacement."
degraded_state = "Keep the failed component isolated while independent functions continue."
safe_state = "Enter SAFE and request independent handover or controlled restart after budget exhaustion."
ftti_ms = 1000
components = ["CMP-SUPERVISOR", "CMP-HANDOVER", "CMP-DIAGNOSTICS"]

[[essential_function]]
id = "EF-DATA-001"
title = "Prevent silent acceptance of corrupt persistent state"
description = "Bind storage mutations to one current resource generation and publish success only after the required flush, readback and recovery contract."
degraded_state = "Operate the affected resource read-only or offline with explicit diagnosis."
safe_state = "Quarantine the resource and refuse further mutation when completion or identity is uncertain."
ftti_ms = 4000
components = ["CMP-STORAGE-SERVICE", "CMP-BLOCK-COMMON", "CMP-VFS", "CMP-FAT12", "CMP-FAT32"]

[[essential_function]]
id = "EF-BOOT-001"
title = "Start only a structurally validated baseline"
description = "Reject malformed boot manifests, kernel images and ambiguous system-volume selection before normal service publication."
degraded_state = "Remain in bounded rescue diagnostics without publishing normal services."
safe_state = "Stop boot with outputs inactive when no validated baseline exists."
ftti_ms = 1000
components = ["CMP-BOOT"]

[[requirement]]
id = "REQ-ISO-001"
statement = "All user, IPC, capability and device authorities shall be versioned, bounded and validated before side effects."
design = ["docs/architecture/REIST_ARCHITECTURE.md", "docs/architecture/USERSPACE_DRIVER_MODEL.md"]

[[requirement]]
id = "REQ-REC-001"
statement = "Recovery shall follow detect, isolate, fence/revoke, reap, recreate, self-test and reintegrate within fixed budgets."
design = ["docs/architecture/RESILIENCE_AND_DEGRADATION_CONTRACT.md"]

[[requirement]]
id = "REQ-RES-001"
statement = "Critical execution shall preserve fixed CPU, stack, memory, queue, I/O and restart reserves under overload."
design = ["docs/architecture/HIGH_ASSURANCE_CORE_CONTRACT.md", "docs/architecture/SYNCHRONIZATION_CONTRACT.md"]

[[requirement]]
id = "REQ-DAT-001"
statement = "Persistent and protocol state shall validate identity, integrity, order, freshness and durable completion before publication."
design = ["docs/architecture/HIGH_ASSURANCE_CORE_CONTRACT.md", "docs/architecture/REIST_ARCHITECTURE.md"]

[[requirement]]
id = "REQ-DEV-001"
statement = "A device shall receive no bus-master or register authority until ownership, ranges, DMA mediation and fencing are validated."
design = ["docs/architecture/USERSPACE_DRIVER_MODEL.md"]

[[requirement]]
id = "REQ-BOOT-001"
statement = "Boot shall fail closed on an invalid manifest, image, system-volume identity or unsupported release state."
design = ["docs/architecture/REIST_ARCHITECTURE.md"]

[[requirement]]
id = "REQ-OBS-001"
statement = "Diagnostics shall remain bounded, preserve crash evidence and never consume reserved recovery resources."
design = ["docs/architecture/HIGH_ASSURANCE_CORE_CONTRACT.md", "docs/architecture/RESILIENCE_AND_DEGRADATION_CONTRACT.md"]

[[requirement]]
id = "REQ-PROFILE-001"
statement = "Unselected reference profiles and unqualified hardware shall remain excluded from release and assurance claims."
design = ["docs/architecture/HIGH_ASSURANCE_CORE_CONTRACT.md", "docs/architecture/MEDICAL_HIGH_ASSURANCE_CONTRACT.md"]

[[requirement]]
id = "REQ-MON-001"
statement = "Unknown kernel progress shall cause a separately powered and clocked target monitor to latch hazardous outputs safe, verify the electrical state independently and reset the affected channel within the allocated FTTI before any reintegration authority is published."
design = ["docs/architecture/EXTERNAL_SAFETY_MONITOR_CONTRACT.md", "docs/architecture/REIST_ARCHITECTURE.md"]

