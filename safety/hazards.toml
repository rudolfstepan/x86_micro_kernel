[[hazard]]
id = "HZ-KERNEL-001"
title = "Unbekannte Kernel-, Exception- oder Stackkorruption aktiviert Ausgänge weiter"
category = "core"
components = ["CMP-KERNEL", "CMP-DIAGNOSTICS"]
essential_functions = ["EF-ISOLATION-001", "EF-RECOVERY-001"]
causes = ["Double Fault", "Stacküberlauf", "interner Invariantenbruch"]
effects = ["Verlust der Schutzgrenze", "unkontrollierte Ausgabe", "Verlust lokaler Essential Functions"]
phases = ["boot", "runtime", "recovery"]
severity = "catastrophic"
degraded_state = "Keine lokale Weiterarbeit; nur ein unabhängig validierter Kanal darf fortführen."
safe_state = "Ausgänge sperren, Crashrecord sichern und den Kanal kontrolliert neu starten."
ftti_ms = 1000
ftti_rationale = "Fatalbudget und Watchdog verlangen Fencing und Reset innerhalb einer Sekunde."
requirements = ["REQ-ISO-001", "REQ-REC-001", "REQ-OBS-001"]
design = ["docs/architecture/HIGH_ASSURANCE_CORE_CONTRACT.md", "docs/architecture/RESILIENCE_AND_DEGRADATION_CONTRACT.md"]
controls = ["kernel/init/fatal.c", "arch/x86/cpu/isr.asm", "kernel/init/output_fence.c", "kernel/init/kernel_log.c"]
verification = ["test/test_reist_fatal_containment.py", "test/test_reist_double_fault_recovery.py", "test/test_reist_user_stack_guards.py", "test/test_reist_persistent_crash.py"]
acceptance_criteria = ["Fatalpfade bleiben vorallokiert und begrenzt.", "Gastnachweis beobachtet Fence, Crashrecord und Watchdog-Neustart geordnet."]
owner = "REIST core team"
status = "partially_verified"
assumptions = ["Ein externer Hardware-Fence ist noch nicht qualifiziert."]
residual_risk = "Kontinuität ohne unabhängigen Hardwarekanal ist nicht nachgewiesen."

