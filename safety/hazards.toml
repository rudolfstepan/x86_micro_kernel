[[hazard]]
id = "HZ-MONITOR-001"
title = "Der fehlerhafte Rechnerkanal bleibt ohne unabhängig bestätigtes Fence aktiv"
category = "profile"
components = ["CMP-KERNEL", "CMP-HANDOVER", "CMP-RESEARCH-PROFILE"]
essential_functions = ["EF-ISOLATION-001", "EF-RECOVERY-001"]
causes = ["festhängende CPU", "Kernelkorruption", "Heartbeat- oder Transportverlust", "Monitor-Strom- oder Taktfehler", "defekter Fence-Treiber", "falsches Readback"]
