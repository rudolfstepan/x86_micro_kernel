<!doctype html><html><head><meta charset="utf-8"><title>JavaScript test</title>
<style>body { background:white; color:#101010; } p { font-size:24px; }
.waiting { color:#b21b25; } .working { color:#127a31; }</style></head><body>
<h1>REIST JavaScript</h1><p id="result" class="waiting" data-js="before">JavaScript not executed</p>
<script>
var executions=1;
var target=document.getElementById('result');
var classes=target.classList;
classes.remove('waiting'); classes.add('staging');
target.id='script-result'; target.setAttribute('DATA-JS','first');
target.setAttribute('style','font-weight:bold');
var futureAbsent=document.getElementById('future')===null;
target.textContent='First script';
throw new Error('Expected ordinary author exception');
</script>
<script>
if(window!==self || executions!==1 || !futureAbsent || target!==document.getElementById('script-result') || target.textContent!=='First script' ||
    classes!==target.classList || !classes.contains('staging') || target.getAttribute('data-js')!=='first')
    throw new Error('Parser order or identity');
target.className='working'; target.removeAttribute('style'); target.id='result';
if(!classes.contains('working') || target.hasAttribute('style')) throw new Error('Attribute reflection');
target.textContent='JavaScript works: order, DOM, exception OK';
document.title='REIST JavaScript OK';
executions++;
</script>
<p id="future">Future parser node</p>
<script src="absent.js">document.title='BAD EXTERNAL';</script>
<script type="module">document.title='BAD MODULE';</script>
<noscript>BAD NOSCRIPT</noscript>
<p><a href="jsnext.htm">Next JavaScript document</a></p>
</body></html>
