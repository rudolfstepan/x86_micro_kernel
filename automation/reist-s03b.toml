  "docs/architecture/REIST_ARCHITECTURE.md",
  "docs/development/OS_GAP_ANALYSIS_AND_ROADMAP.md",
  "docs/development/PROJECT_STATUS.md"
]
invariants = [
  "VFS operations 1 through 11 storage request operation 31 and both Claim ABIs remain byte exact",
  "operation 8 grants only the documented legacy READ SEEK STAT set while operation 12 grants only a validated explicit nonempty read-only rights mask",
  "read stat seek and delegation each fail before state or output publication when their corresponding right is absent",
  "delegation creates one distinct target-owned slot and grants only a nonempty subset of source rights; DELEGATE is never implicit",
  "target PID and generation are revalidated by the service before publication and adoption is accepted only from that exact Claim-v2 owner",
