  "the rescue per-image bound is exactly 116 KiB while the aggregate rescue pool remains exactly 272 KiB and the measured eleven-image set fits",
  "no write mutation truncate standard descriptor dup dup2 ambient spawn inheritance kernel VFS fallback controller or DMA authority is added"
]
targeted_tests = [
