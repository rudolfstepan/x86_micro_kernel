status = "done"
risk = "high"
title = "Diagnose FAT12 cluster chains and repair unambiguous excess tails"
scope = "Extend the capability-bound FAT12 check with fixed-capacity traversal of root and nested directory entries, all reachable cluster chains and allocated-cluster ownership. Diagnose invalid links, loops, cross-links, short or excess file chains, malformed directory entries, orphan allocations and scan-capacity exhaustion. Add an explicitly confirmed repair operation that only truncates structurally valid overlong regular-file chains when no other inconsistency exists. Journal every changed FAT sector in both mirrors, renew the exclusive current-media lease throughout, verify a clean full rescan and fail closed for every ambiguous or destructive case."
