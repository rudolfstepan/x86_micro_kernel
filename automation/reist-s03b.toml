]
invariants = [
  "CHKDSK still has no raw-media authority and the new repair operation is append-only and accepted only from its maintenance domain",
  "all cluster, owner, directory-work and repair-candidate storage has fixed compile-time capacity and every chain or directory walk is bounded by the validated FAT12 cluster count",
  "the read-only scan validates both identical FAT mirrors before consuming directory or chain metadata",
  "root and nested directory entries reject invalid attributes and cluster fields, skip deleted, LFN, volume-label, dot and dot-dot entries according to FAT terminology, and never follow an out-of-range sector",
