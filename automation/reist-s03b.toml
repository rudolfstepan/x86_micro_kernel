[[packages]]
id = "R1.2a-resilient-page-poc"
status = "done"
phase = "post-s0"
risk = "high"
title = "Model a fixed-capacity resilient page transaction"
scope = "Introduce the first explicitly mediated software-memory-resilience object without claiming transparent virtual-memory or physical DIMM mirroring. Build at most four kernel-owned 4096-byte objects from fixed storage. Each object uses two copy-on-write banks in each of two labeled simulated failure domains, CRC32-protected page bytes and generation-scoped metadata protected through the existing critical-object envelope. Reads select only the committed generation; writes prepare and validate inactive banks before one metadata commit. A deterministic host fault campaign may fail exactly one complete simulated domain before prepare, between replica preparation and commit, after commit, during scrub and during bounded rebuild to a fixed replacement domain. The object enters HEALTHY DEGRADED REBUILDING or FAILED without heap allocation blocking VFS DMA arbitrary PTE manipulation or user authority. Prove stale-handle rejection capacity bounds last-committed-generation recovery single-domain continuation fail-closed double loss and successful bounded rebuild. Compile the module into the normal kernel image but defer frame-allocator zones SMBIOS IMC decoding MCE EDAC physical fault injection and arbitrary process-page adoption to separate packages."
