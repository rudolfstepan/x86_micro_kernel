version = 1
program = "S0.3b"
active_id = ""

[policy]
one_package_per_run = true
advance_only_after_commit_gates = true
allow_parallel_writers = false
max_read_only_reviewers = 1
external_writes = false
push = false

[[packages]]
id = "S0.3b-1"
status = "done"
risk = "high"
title = "Finite IPC deadlines"
scope = "Add finite monotonic deadlines and explicit nonblocking behavior to IPC send/receive. Keep syscall 50/51 and old SDK calls source-compatible through a finite default; append timeout syscalls 53/54. Prefer a bounded MAX_TASKS scan with per-task deadline metadata; never place the existing single wait_node in two queues."
allowed_files = [
  "include/kernel/ipc.h",
  "kernel/ipc/ipc.c",
  "kernel/sched/scheduler.h",
  "kernel/sched/scheduler.c",
  "kernel/sched/wait_queue.h",
  "kernel/sched/wait_queue.c",
  "kernel/time/pit.c",
  "kernel/time/pit.h",
  "kernel/syscall/syscall_table.c",
  "lib/libc/stdlib.h",
  "userspace/sdk/include/x86os.h",
  "userspace/sdk/x86os.c",
  "examples/userspace/guest_test.c",
  "test/test_ipc_host.c",
  "test/test_reist_ipc.py",
  "test/test_scheduler_time.py",
  "docs/architecture/REIST_ARCHITECTURE.md",
  "docs/development/OS_GAP_ANALYSIS_AND_ROADMAP.md",
  "automation/reist-s03b.toml"
]
invariants = [
  "timeout zero never blocks and returns EAGAIN",
  "a positive expired deadline returns ETIMEDOUT (-110)",
  "deadline arithmetic saturates at UINT64_MAX and uses pit_monotonic_ms",
  "normal wake, timeout, close, kill and revoke remove a waiter exactly once",
  "timeout leaves message and capability state unchanged",
  "no polling, heap allocation or unbounded retry",
  "syscalls are append-only and user pointers are validated before blocking"
]
targeted_tests = [
  "python test/test_reist_ipc.py -q",
  "python test/test_scheduler_time.py -q"
]
package_tests = [
  ".\\scripts\\test-reist-package.ps1 -Target qemu -Video vga"
]
runtime_tests = [
  ".\\scripts\\test-reist-runtime.ps1 -Mode normal"
]
stop_conditions = [
  "timed waiting cannot be expressed without enqueueing one intrusive node twice",
  "append-only ABI compatibility cannot be retained",
  "an unrelated worktree change overlaps an allowed file",
  "a gate still fails after one focused in-scope repair"
]
commit_message = "feat: add bounded IPC deadlines"
evidence = [
  "python test/test_reist_ipc.py -q",
  "python test/test_scheduler_time.py -q",
  ".\\scripts\\test-reist-package.ps1 -Target qemu -Video vga",
  ".\\scripts\\test-reist-runtime.ps1 -Mode normal",
]

[[packages]]
id = "S0.3b-2"
status = "done"
risk = "high"
title = "Protected IPC metadata"
scope = "Protect bounded endpoint, queue and authoritative global capability records with critical_object-compatible redundancy, validation and fail-closed corruption handling. Process-local handle slots remain non-authoritative selectors and must resolve through protected global records before use. Add deterministic single- and multi-bit fault injection."
allowed_files = [
  "include/kernel/ipc.h",
  "kernel/ipc/ipc.c",
  "include/kernel/critical_object.h",
  "kernel/init/critical_object.c",
  "test/test_ipc_host.c",
  "test/test_reist_ipc.py",
  "test/test_reist_critical_object.py",
  "examples/userspace/guest_test.c",
  "docs/architecture/REIST_ARCHITECTURE.md",
  "docs/development/OS_GAP_ANALYSIS_AND_ROADMAP.md",
  "automation/reist-s03b.toml"
]
invariants = [
  "all protected payloads fit fixed critical_object capacity or are split explicitly",
  "validation occurs before rights, queue indexes or payload are used",
  "process-local handle corruption cannot grant authority because every use resolves a protected holder-scoped global record",
  "corruption never grants authority or emits unvalidated data",
  "single-bit correction is logged boundedly and double corruption fails closed",
  "waiters on a quarantined endpoint are woken and receive a distinct integrity error"
]
targeted_tests = [
  "python test/test_reist_ipc.py -q",
  "python test/test_reist_critical_object.py -q"
]
package_tests = [
  ".\\scripts\\test-reist-package.ps1 -Target qemu -Video vga"
]
runtime_tests = [
  ".\\scripts\\test-reist-runtime.ps1 -Mode normal"
]
stop_conditions = [
  "critical_object validation would require heap allocation or unbounded IRQ-off work",
  "the corruption policy can publish partially validated state",
  "a gate still fails after one focused in-scope repair"
]
commit_message = "feat: protect IPC control metadata"
evidence = [
  "python test/test_reist_ipc.py -q",
  "python test/test_reist_critical_object.py -q",
  ".\\scripts\\test-reist-package.ps1 -Target qemu -Video vga",
  ".\\scripts\\test-reist-runtime.ps1 -Mode normal",
]

